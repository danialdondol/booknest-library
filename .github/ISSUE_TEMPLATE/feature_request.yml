name: Feature request
description: Propose a focused improvement to BookNest.
title: 'feat: '
labels: ['type:feature', 'needs-triage']
body:
  - type: markdown
    attributes:
      value: |
        BookNest is a demo, not a production library system. Explain the user problem before the
        implementation.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user need or friction does this address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the smallest useful version.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Authentication / session
        - Dashboard
        - Books
        - Members
        - Accessibility
        - Design / responsive
        - Testing / CI
        - Documentation
  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: This works without a backend, or the backend dependency is stated.
        - label: This includes an accessibility consideration.
        - label: I checked the roadmap in README.md.
